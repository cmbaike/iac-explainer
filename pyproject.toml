[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iac-explainer"
version = "0.1.0"
requires-python = ">=3.12"
authors = [
    { name = "Christopher Mbaike", email = "christophermbaike@gmail.com" }
]
maintainers = [
    { name = "Christopher Mbaike", email = "christophermbaike@gmail.com" }
]
description = "A CLI tool that parses a Terraform file and explains in plain English what infrastructure it provisions, what it costs, and what security risks it carries."
dependencies = [
    "anthropic>=0.105.0",
    "python-hcl2>=8.0.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
iac-explain = "iac_explainer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iac_explainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
